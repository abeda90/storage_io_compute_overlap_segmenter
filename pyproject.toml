[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abeda90-storage_io_compute_overlap_segmenter"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对MoE 模型架构师·存储 IO 与计算的重叠相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "abeda90" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://abeda90.github.io"
Repository = "https://github.com/abeda90/storage_io_compute_overlap_segmenter"
Issues = "https://github.com/abeda90/storage_io_compute_overlap_segmenter/issues"

[project.scripts]
storage_io_compute_overlap_segmenter = "storage_io_compute_overlap_segmenter:main"

[tool.setuptools]
py-modules = ["storage_io_compute_overlap_segmenter"]
